[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutest-query-benchmark"
version = "0.1.0"
description = "Reproducible query-based comparison on 30 constrained CUTEst problems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6", "scipy==1.15.2", "pandas==2.3.3", "PyYAML==6.0.3", "matplotlib==3.10.9", "mpmath==1.3.0"]

[project.optional-dependencies]
solvers = ["pycutest==1.8.2", "PyNomadBBO==4.5.1"]

[tool.setuptools.packages.find]
where = ["src"]
